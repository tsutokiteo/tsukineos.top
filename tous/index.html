<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系 · Tsukine OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b12;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            color: #e8e8f0;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 720px;
            width: 100%;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #606080;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #f0c060;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        h1 span {
            color: #f0c060;
        }

        .sub {
            color: #8888aa;
            font-size: 1rem;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid #1e1e2a;
            padding-bottom: 1rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 500px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #13131e;
            border: 1px solid #24243a;
            border-radius: 14px;
            padding: 1.2rem 1.5rem;
            transition: border 0.2s;
        }

        .card:hover {
            border-color: #3a3a5a;
        }

        .card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #606080;
        }

        .card a {
            display: block;
            margin-top: 0.2rem;
            color: #f0c060;
            text-decoration: none;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .card a:hover {
            text-decoration: underline;
        }

        .card .note {
            font-size: 0.8rem;
            color: #606080;
            margin-top: 0.3rem;
        }

        .email-row {
            background: #13131e;
            border: 1px solid #24243a;
            border-radius: 14px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
        }

        .email-row .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #606080;
        }

        .email-row a {
            display: inline-block;
            margin-right: 1.2rem;
            color: #f0c060;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .email-row a:hover {
            text-decoration: underline;
        }

        .footer {
            font-size: 0.8rem;
            color: #505068;
            text-align: center;
            border-top: 1px solid #1a1a28;
            padding-top: 2rem;
            margin-top: 1rem;
        }

        .wechat-note {
            color: #8080a0;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
    <div class="container">

        <a href="https://tsukineos.top" class="back-link">← 返回 Tsukine OS</a>

        <h1>联系 <span>Tsukine OS</span></h1>
        <div class="sub">通过以下渠道找到我们 · 反馈问题 · 提出建议</div>

        <!-- 社交媒体 -->
        <div class="grid-2">

            <div class="card">
                <div class="label">Twitter / X</div>
                <a href="https://x.com/Hoshi_UkiCN" target="_blank">@Hoshi_UkiCN</a>
            </div>

            <div class="card">
                <div class="label">YouTube</div>
                <a href="https://youtube.com/@tsukineos" target="_blank">@tsukineos</a>
            </div>

            <div class="card">
                <div class="label">哔哩哔哩</div>
                <a href="https://space.bilibili.com/3493134312934317" target="_blank">B站主页</a>
            </div>

            <div class="card">
                <div class="label">微博</div>
                <a href="https://weibo.com/u/7447335361" target="_blank">@7447335361</a>
            </div>

            <div class="card">
                <div class="label">小红书</div>
                <a href="https://xhslink.cn/m/9Od7ymV4TYg" target="_blank">小红书主页</a>
            </div>

            <div class="card">
                <div class="label">微信公众号</div>
                <span style="color:#c0c0d8; font-size:0.95rem;">Tsutokiteo_Official</span>
                <div class="wechat-note">🔍 在微信内搜索 ID 即可关注</div>
            </div>

        </div>

        <!-- 邮箱 -->
        <div class="email-row">
            <div class="label">📧 邮箱</div>
            <a href="mailto:tsutokiteo@outlook.com">tsutokiteo@outlook.com</a>
            <a href="mailto:mryofur@outlook.com">mryofur@outlook.com</a>
            <a href="mailto:export@tsukineos.top">export@tsukineos.top</a>
            <div style="color:#606080; font-size:0.8rem; margin-top:0.3rem;">
                点击邮箱地址自动打开邮件客户端
            </div>
        </div>

        <div class="footer">
            Tsukine OS · 月ね！ 🌙
        </div>

    </div>
</body>
</html>
